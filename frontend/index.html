<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Work Order Entry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container py-4">
    <h1 class="mb-1">Client Work Order Entry</h1>
    <p class="text-muted">Laboratory test work order</p>

    <div id="message"></div>

    <div class="card mb-4">
        <div class="card-header">Client & Patient Details</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Client</label>
                    <select id="clientId" class="form-select"></select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Patient Name</label>
                    <input id="patientName" class="form-control" maxlength="100">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Age</label>
                    <input id="age" type="number" min="0" max="120" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Gender</label>
                    <select id="gender" class="form-select">
                        <option value="0">Male</option>
                        <option value="1">Female</option>
                        <option value="2">Other</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Mobile Number</label>
                    <input id="mobileNumber" class="form-control" maxlength="15">
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Test Catalog</div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-8">
                    <input id="testSearch" class="form-control" placeholder="Search test name or code">
                </div>
                <div class="col-md-4">
                    <button id="searchButton" class="btn btn-primary w-100">Search Tests</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead>
                    <tr>
                        <th>Test</th>
                        <th>Code</th>
                        <th>Rate</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="testTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Selected Tests</div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered">
                    <thead>
                    <tr>
                        <th>Test</th>
                        <th>Rate</th>
                        <th style="width:140px">Quantity</th>
                        <th>Amount</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="selectedTests"></tbody>
                </table>
            </div>

            <div class="text-end">
                <h4>Total: ₹<span id="totalAmount">0.00</span></h4>
                <button id="saveButton" class="btn btn-success btn-lg">Save Work Order</button>
            </div>
        </div>
    </div>

    <div id="result" class="card d-none">
        <div class="card-header">Saved Work Order</div>
        <div class="card-body" id="resultBody"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
